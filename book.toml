[book]
authors = ["Семенов Андрей"]
description = "Заметки о языке Rust и всем, что с ним связано."
language = "ru"
src = "src"
title = "Заметки о Rust"

[rust]
edition = "2024"

[build]
use-default-preprocessors = true  # use the default preprocessors

[output.html]
default-theme = "Rust"
mathjax-support = true
# hash-files = true
additional-css = ["src/custom.css", "./mdbook-admonish.css"]
input-404 = "not-found.md"
git-repository-url = "https://github.com/andsemenoff/rustnotes"
git-repository-icon = "fab-github"

[output.html.fold]
enable = false    # whether or not to enable section folding
level = 0         # the depth to start folding

[output.html.print]
enable = true    # include support for printable output
page-break = true # insert page-break after each chapter

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`